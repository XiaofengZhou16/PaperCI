spec_version: "0.4"

project:
  id: minimal-mechanism-example
  title: A minimal PaperCI story example
  mode: sketch
  created_at: "2026-08-12T12:00:00+08:00"

evidence:
  - id: E001
    kind: quantitative_result
    statement: Target expression was higher after exposure than in control cells.
    status: draft
    source:
      uri: results/expression.csv
      locator: "row=2"
    design:
      family: experiment
      unit_of_analysis: biological_sample
      groups:
        - id: control
          n: 5
        - id: exposed
          n: 5
      randomized: unknown
      blinded: unknown
    result:
      outcome: target expression
      contrast: exposed minus control
      direction: increase
      effect:
        value: 1.1
        unit: log2_fold_change
      uncertainty:
        kind: confidence_interval
        level: 0.95
        lower: 0.3
        upper: 1.9
      p_value: 0.02
      multiplicity: not_reported
    scope:
      system: cultured primary cells
      context: tested exposure protocol

  - id: E002
    kind: analysis_output
    statement: A candidate transcription-factor motif was enriched in accessible regions.
    status: draft
    source:
      uri: results/motifs.tsv
      locator: "row=2"
    scope:
      system: cultured primary cells
      context: tested exposure protocol

claims:
  - id: C001
    text: Exposure is associated with higher target expression in the tested system.
    type: association
    strength: supports
    status: candidate
    supports: [E001]
    challenges: []
    assumptions: []
    alternatives:
      - A technical or composition difference explains the result.
    scope:
      system: cultured primary cells
      context: tested exposure protocol

  - id: C002
    text: The candidate transcription factor directly drives target expression.
    type: mechanism
    strength: demonstrates
    status: candidate
    supports: [E002]
    challenges: []
    depends_on: [C001]
    assumptions:
      - Motif enrichment reflects direct occupancy and functional regulation.
    alternatives:
      - The motif marks a correlated chromatin state without direct regulation.
    scope:
      system: cultured primary cells
      context: tested exposure protocol

stories:
  - id: S001
    title: Exposure-associated target induction with a candidate regulatory mechanism
    profile: mechanistic_biology
    central_question: How does exposure alter target expression in the tested system?
    central_claim: C001
    claim_path: [C001, C002]
    beats:
      - role: discovery
        claim_ids: [C001]
      - role: mechanism
        claim_ids: [C002]
    figure_plan:
      - figure: 1
        question: Does exposure alter target expression?
        evidence_ids: [E001]
        claim_ids: [C001]
      - figure: 2
        question: Which regulators are candidates?
        evidence_ids: [E002]
        claim_ids: [C002]
    gaps:
      - id: G001
        question: Does the candidate factor bind and functionally regulate the target?
        blocks: [C002]
        severity: central
        competing_explanations:
          - direct regulation
          - correlated chromatin state
        proposed_tests:
          - design: Perturb the factor and measure occupancy plus target expression.
            distinguishes:
              - direct regulation
              - correlated chromatin state
            feasibility: medium
            expected_information_gain: high
            dependencies: []
    status: candidate

reviews: []
hypotheses: []
runs: []
