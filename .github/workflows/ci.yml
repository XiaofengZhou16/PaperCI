name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Code quality
        run: ruff check src tests scripts
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Validate example
        run: paperci validate examples/minimal-project.yaml
      - name: Lint intentional overclaim example
        run: paperci lint examples/minimal-project.yaml --fail-on never
      - name: Exercise one-command demo
        run: |
          paperci demo ci-demo
          paperci doctor ci-demo
          paperci lint ci-demo --fail-on never
          paperci compare-hypotheses ci-demo

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install -e ".[dev]"
      - name: Build wheel and source archive
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Smoke-test built wheel
        run: python scripts/smoke_distribution.py dist/*.whl
      - name: Smoke-test source archive
        run: python scripts/smoke_distribution.py dist/*.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: paperci-distributions
          path: dist/*
